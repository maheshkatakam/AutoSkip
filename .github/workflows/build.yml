name: Build APK

# Every push: run the unit tests, build the app, check it requests no permissions, and run
# the emulator test (AutoSkip against fake YouTube and YouTube Music apps, on two Android
# versions; see .github/scripts/e2e.sh).
# On your own repo (where the signing secrets exist) the APK is signed with the permanent
# release key, so each build installs over the previous one. Pull requests from forks have
# no access to secrets and get the throwaway debug key instead.
#
# Every action is pinned to an exact commit (version in the comment), so a compromised or
# changed action can't silently run with the signing key. Dependabot proposes updates monthly
# (.github/dependabot.yml).

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Pinned rather than ubuntu-latest, which moves to a new Ubuntu release on its own schedule.
    runs-on: ubuntu-24.04
    env:
      HAS_RELEASE_KEY: ${{ secrets.AUTOSKIP_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
        with:
          packages: 'platforms;android-36 build-tools;36.1.0'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # The key exists only inside this step, for the Gradle build, and is deleted after it.
      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.AUTOSKIP_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AUTOSKIP_KEYSTORE_PASSWORD }}
        run: |
          if [ "$HAS_RELEASE_KEY" = "true" ]; then
            .github/scripts/load-release-key.sh ./gradlew :app:assembleRelease --no-daemon
          else
            ./gradlew :app:assembleRelease --no-daemon
          fi

      - name: Check permissions and signature
        run: |
          if [ "$HAS_RELEASE_KEY" = "true" ]; then
            .github/scripts/verify-apk.sh app/build/outputs/apk/release/app-release.apk --release
          else
            echo "::notice::No release key available, so this APK is signed with a throwaway debug key."
            .github/scripts/verify-apk.sh app/build/outputs/apk/release/app-release.apk
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: AutoSkip-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  emulator-test:
    name: Emulator test (Android API ${{ matrix.api-level }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Android 11 and Android 16.
        api-level: [30, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
        with:
          packages: 'platforms;android-36 build-tools;36.1.0'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0

      - name: Build AutoSkip (debug) and the fake apps
        run: ./gradlew :app:assembleDebug :fakeapps:assembleYoutubeDebug :fakeapps:assembleMusicDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The test script leaves e2e-started.marker once the emulator is up. If the first attempt
      # fails without it, the emulator itself never started (a GitHub machine hiccup), so try
      # once more; the retry's own result decides the job. A failure after the test started
      # is never retried.
      - name: Play fake ads and check what AutoSkip pressed and counted
        id: e2e
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          # The plain Android image: no Google apps. Google's images ship a YouTube stub
          # (so the fake YouTube can't install) and boot far slower on CI.
          target: default
          arch: x86_64
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/e2e.sh

      # Decided once, right after the first attempt: a retry leaves its own marker.
      - name: Did the first attempt's emulator start?
        id: started
        if: steps.e2e.outcome == 'failure'
        run: |
          if [ -f e2e-started.marker ]; then started=true; else started=false; fi
          echo "first_attempt=$started" >> "$GITHUB_OUTPUT"
          echo "First attempt failed; its emulator started: $started"

      - name: Retry, because the emulator didn't start
        if: steps.e2e.outcome == 'failure' && steps.started.outputs.first_attempt == 'false'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          # The plain Android image: no Google apps. Google's images ship a YouTube stub
          # (so the fake YouTube can't install) and boot far slower on CI.
          target: default
          arch: x86_64
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/e2e.sh

      - name: Fail, because the emulator test failed
        if: steps.e2e.outcome == 'failure' && steps.started.outputs.first_attempt == 'true'
        run: |
          echo "::error::The emulator test failed. See the notes above for which check."
          exit 1

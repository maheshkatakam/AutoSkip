name: Build APK

# Every push: run the unit tests, build the app, check it requests no permissions, and run
# the emulator test (AutoSkip against fake YouTube and YouTube Music apps, on two Android
# versions; see .github/scripts/e2e.sh).
# On your own repo (where the signing secrets exist) the APK is signed with the permanent
# release key, so each build installs over the previous one. Pull requests from forks have
# no access to secrets and get the throwaway debug key instead.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Pinned rather than ubuntu-latest, which moves to a new Ubuntu release on its own schedule.
    runs-on: ubuntu-24.04
    env:
      HAS_RELEASE_KEY: ${{ secrets.AUTOSKIP_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.1.0'

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Load the release key
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.AUTOSKIP_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AUTOSKIP_KEYSTORE_PASSWORD }}
        run: .github/scripts/load-release-key.sh

      - name: Build APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Check permissions and signature
        run: |
          if [ "$HAS_RELEASE_KEY" = "true" ]; then
            .github/scripts/verify-apk.sh app/build/outputs/apk/release/app-release.apk --release
          else
            echo "::notice::No release key available, so this APK is signed with a throwaway debug key."
            .github/scripts/verify-apk.sh app/build/outputs/apk/release/app-release.apk
          fi

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/autoskip-release.p12"

      - uses: actions/upload-artifact@v6
        with:
          name: AutoSkip-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  emulator-test:
    name: Emulator test (Android API ${{ matrix.api-level }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Android 11 and Android 16.
        api-level: [30, 36]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.1.0'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build AutoSkip (debug) and the fake apps
        run: ./gradlew :app:assembleDebug :fakeapps:assembleYoutubeDebug :fakeapps:assembleMusicDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The test script leaves e2e-started.marker once the emulator is up. If the first attempt
      # fails without it, the emulator itself never started (a GitHub machine hiccup), so try
      # once more. A failure after the test started is never retried.
      - name: Play fake ads and check what AutoSkip pressed and counted
        id: e2e
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          # The plain Android image: no Google apps. Google's images ship a YouTube stub
          # (so the fake YouTube can't install) and boot far slower on CI.
          target: default
          arch: x86_64
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/e2e.sh

      - name: Retry, because the emulator didn't start
        if: steps.e2e.outcome == 'failure' && hashFiles('e2e-started.marker') == ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          # The plain Android image: no Google apps. Google's images ship a YouTube stub
          # (so the fake YouTube can't install) and boot far slower on CI.
          target: default
          arch: x86_64
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/e2e.sh

      - name: Fail, because the emulator test failed
        if: steps.e2e.outcome == 'failure' && hashFiles('e2e-started.marker') != ''
        run: |
          echo "::error::The emulator test failed. See the notes above for which check."
          exit 1

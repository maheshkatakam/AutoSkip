name: Release

# Publishes a version on the Releases page. Start it either way:
#   - on GitHub: Releases > Draft a new release > new tag such as v1.0 > Publish release
#   - from a terminal: push a tag such as v1.0
# The tag must match versionName in app/build.gradle.kts, and the APK must be signed with
# the release key recorded in .github/release-cert-sha256, or no APK is attached.

on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Check the tag matches the app version
        run: |
          version="$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName \"$version\" in app/build.gradle.kts. Tag it v$version, or change versionName first."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.1.0'

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Load the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.AUTOSKIP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The AUTOSKIP_KEYSTORE_BASE64 secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/autoskip-release.p12"
          echo "AUTOSKIP_KEYSTORE=$RUNNER_TEMP/autoskip-release.p12" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          AUTOSKIP_KEYSTORE_PASSWORD: ${{ secrets.AUTOSKIP_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/autoskip-release.p12"

      - name: Check permissions and signature
        run: .github/scripts/verify-apk.sh app/build/outputs/apk/release/app-release.apk --release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          apk="AutoSkip-$tag.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          cert="$(tr -d '[:space:]' < .github/release-cert-sha256)"

          cat > notes.md <<NOTES
          ## Install

          1. Download **$apk** below and open it on your Android phone (Android 8.0 or later).
          2. Android 13 and later: before turning AutoSkip on, open **Settings → Apps → AutoSkip → ⋮ → Allow restricted settings**.
          3. Open AutoSkip and follow the steps to turn it on in Accessibility settings.

          Updating from an earlier release installs over it. If you installed a build from somewhere else (Android Studio, a fork), uninstall that first.

          ## Check it's genuine

          Every official AutoSkip release is signed with the same key. Its SHA-256 certificate fingerprint is:

          \`$cert\`

          To check a download yourself: \`apksigner verify --print-certs $apk\` must show that value as the certificate SHA-256 digest. The file's own SHA-256 checksum is in **$apk.sha256**.

          This build requests **no Android permissions**, including no internet access; the release was refused automatically otherwise.
          NOTES

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Made on the website (or by an earlier run): attach the files, and add the
            # install and verification notes below anything already written there.
            gh release upload "$tag" "$apk" "$apk.sha256" --clobber --repo "$GITHUB_REPOSITORY"
            body="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
            if ! grep -q "## Check it's genuine" <<<"$body"; then
              if [ -n "$(tr -d '[:space:]' <<<"$body")" ]; then
                printf '%s\n\n' "$body" | cat - notes.md > notes-combined.md
              else
                cp notes.md notes-combined.md
              fi
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes-combined.md
            fi
          else
            gh release create "$tag" "$apk" "$apk.sha256" --repo "$GITHUB_REPOSITORY" \
              --title "AutoSkip $tag" --notes-file notes.md --verify-tag
          fi

name: Release

# Attaches the signed APK to a release when you publish one: on GitHub, Releases > Draft a
# new release > new tag such as v1.2 > Publish release (or `gh release create v1.2`).
# The tag must match versionName in app/build.gradle.kts, and the APK must be signed with
# the release key recorded in .github/release-cert-sha256, or no APK is attached.
#
# Every action is pinned to an exact commit (version in the comment), so a compromised or
# changed action can't silently run with the signing key. Dependabot proposes updates monthly
# (.github/dependabot.yml).

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Check the tag matches the app version
        run: |
          version="$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName \"$version\" in app/build.gradle.kts. Tag it v$version, or change versionName first."
            exit 1
          fi

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
        with:
          packages: 'platforms;android-36 build-tools;36.1.0'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c  # v5.0.2

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # The key exists only inside this step, for the Gradle build, and is deleted after it.
      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.AUTOSKIP_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AUTOSKIP_KEYSTORE_PASSWORD }}
        run: .github/scripts/load-release-key.sh ./gradlew :app:assembleRelease --no-daemon

      - name: Check permissions and signature
        run: .github/scripts/verify-apk.sh app/build/outputs/apk/release/app-release.apk --release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          apk="AutoSkip-$tag.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          cert="$(tr -d '[:space:]' < .github/release-cert-sha256)"

          cat > notes.md <<NOTES
          ## Install

          1. Download **$apk** below and open it on your Android phone (Android 8.0 or later).
          2. Open AutoSkip and turn it on in Accessibility settings.

          The [install guide](https://github.com/$GITHUB_REPOSITORY#install-guide) has every step, including what to do if your phone blocks the install or the Accessibility switch is greyed out.

          Updating from an earlier release installs over it and keeps your settings. If you installed a build from somewhere else (Android Studio, a fork), uninstall that first.

          ## Check it's genuine

          Every official AutoSkip release is signed with the same key. Its SHA-256 certificate fingerprint is:

          \`$cert\`

          To check a download yourself: \`apksigner verify --print-certs $apk\` must show that value as the certificate SHA-256 digest. The file's own SHA-256 checksum is in **$apk.sha256**.

          This build requests **no Android permissions**, including no internet access; no APK would have been attached otherwise.
          NOTES

          # The release already exists (you published it). Attach the files, and add the
          # install and verification notes below anything you wrote.
          if ! gh release upload "$tag" "$apk" "$apk.sha256" --clobber --repo "$GITHUB_REPOSITORY"; then
            echo "::error::Could not attach the APK to release $tag."
            exit 1
          fi
          body="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          if ! grep -q "## Check it's genuine" <<<"$body"; then
            if [ -n "$(tr -d '[:space:]' <<<"$body")" ]; then
              printf '%s\n\n' "$body" | cat - notes.md > notes-combined.md
            else
              cp notes.md notes-combined.md
            fi
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes-combined.md \
              || echo "::warning::The APK is attached, but the release notes could not be updated."
          fi
